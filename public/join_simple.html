        .error-msg { color: #d93025; font-size: 13px; margin-bottom: 15px; display: none; font-weight: bold; }
        label { font-weight: bold; display: block; text-align: left; color: #444; }
        button { width: 100%; padding: 12px; background: #0070f3; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }

        <button onclick="submitName()">Join Class</button>

    <script>
        const socket = io();

        // Build a set of all valid exact values from the datalist
        const validOptions = Array.from(document.querySelectorAll('#rosterCandidates option')).map(opt => opt.value);

        function submitName() {
            const inputField = document.getElementById('studentName');
            const errorElement = document.getElementById('errorMsg');
            const name = inputField.value.trim();
            
            // Check if what they typed exists in the official roster list
            if (!validOptions.includes(name)) {
                errorElement.style.display = 'block';
                inputField.style.borderColor = '#d93025';
                inputField.value = '';
                inputField.focus();
                return;
            }

            errorElement.style.display = 'none';
            inputField.style.borderColor = '#ccc';

            socket.emit('studentJoin', { name: name, active: 'yes' });
            
            document.getElementById('formContainer').innerHTML = `
            <h2>🎉 Checked In!</h2>
            <p>Welcome, <b>${name}</b>!</p>
            <p>Your seat will be assigned shortly.</p>
            <br>
            <a href="/seating.html" style="display: block; padding: 12px; background: #28a745; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">
                👀 View Seating Chart
            </a>
            `;
        }
    </script>
